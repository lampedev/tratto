# Versioni verificate su dl.google.com/android/maven2 e repo1.maven.org (20/10/2026).
# Vincolo: compileSdk 36. Compose >= 1.12, core >= 1.19 e lifecycle-runtime-compose >= 2.11
# richiedono compileSdk 37 (minCompileSdk nell'AAR): per questo sono fermi un gradino sotto.
[versions]
agp = "9.4.1"
kotlin = "2.4.21"                 # KGP sul classpath (AGP 9.4.1 porterebbe 2.2.10); il plugin Compose deve avere la STESSA versione
composeBom = "2026.06.01"         # ui/foundation 1.11.4, material3 1.4.0
coreKtx = "1.18.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
coroutines = "1.11.0"
ink = "1.1.0-alpha09"
motionPrediction = "1.0.0"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }

androidx-ink-authoring = { module = "androidx.ink:ink-authoring", version.ref = "ink" }
androidx-ink-brush = { module = "androidx.ink:ink-brush", version.ref = "ink" }
androidx-ink-geometry = { module = "androidx.ink:ink-geometry", version.ref = "ink" }
androidx-ink-rendering = { module = "androidx.ink:ink-rendering", version.ref = "ink" }
androidx-ink-strokes = { module = "androidx.ink:ink-strokes", version.ref = "ink" }
androidx-ink-storage = { module = "androidx.ink:ink-storage", version.ref = "ink" }
androidx-input-motionprediction = { module = "androidx.input:input-motionprediction", version.ref = "motionPrediction" }

[bundles]
ink = [
    "androidx-ink-authoring",
    "androidx-ink-brush",
    "androidx-ink-geometry",
    "androidx-ink-rendering",
    "androidx-ink-strokes",
    "androidx-ink-storage",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
